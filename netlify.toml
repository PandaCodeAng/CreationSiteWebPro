[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  included_files = ["src/services/**"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/services/creation-site-web-casablanca"
  to = "/creation-site-web-casablanca"
  status = 301
  force = true

[[redirects]]
  from = "/contact-refactor"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/blog/creation-site-web-casablanca-guide"
  to = "/blog/guide-creation-site-web-casablanca"
  status = 301
  force = true

# Doublon de la page d'accueil : /index.html répondait 200 sans être canonicalisé
# (M-11 de l'audit GEO).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Slugs d'articles débarrassés de leur suffixe d'année : les URLs portaient
# « 2024 » alors que titres et contenus annoncent 2026 (H-1 de l'audit GEO).
[[redirects]]
  from = "/blog/prix-creation-site-web-casablanca-2024"
  to = "/blog/prix-creation-site-web-casablanca"
  status = 301
  force = true

[[redirects]]
  from = "/blog/guide-creation-site-web-casablanca-2024"
  to = "/blog/guide-creation-site-web-casablanca"
  status = 301
  force = true

[[redirects]]
  from = "/blog/strategies-seo-sites-web-marocains-2024"
  to = "/blog/strategies-seo-sites-web-marocains"
  status = 301
  force = true

[[redirects]]
  from = "/blog/guide-digitalisation-entreprise-marocaine-2024"
  to = "/blog/guide-digitalisation-entreprise-marocaine"
  status = 301
  force = true

[[redirects]]
  from = "/blog/tendances-web-design-maroc-2024"
  to = "/blog/tendances-web-design-maroc"
  status = 301
  force = true

[[redirects]]
  from = "/blog/webpages-modernes-creation-site-web-2024"
  to = "/blog/webpages-modernes-creation-site-web"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google-analytics.com https://www.googletagmanager.com https://static.axept.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.axept.io; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.google.com https://www.googletagmanager.com https://*.axept.io https://*.axeptio.eu https://*.axeptio.tech; frame-src 'self' https://www.google.com https://maps.google.com; media-src 'self' https://axeptio-video.imgix.net;"

# Configuration pour les assets statiques
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les images de /images ne sont pas hashées : on ne peut donc pas les marquer
# `immutable`, mais `max-age=0, must-revalidate` (défaut constaté en B-6 de
# l'audit GEO) forçait une revalidation à chaque vue. Un cache d'un mois avec
# revalidation en arrière-plan évite les allers-retours sans figer les visuels.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[build.processing]
  skip_processing = false

[build.processing.html]
  # Désactivé : combiné à `build.format: 'file'`, `pretty_urls` réintroduirait des
  # redirections sur les URLs déclarées dans le sitemap (H-2 de l'audit GEO).
  pretty_urls = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true
